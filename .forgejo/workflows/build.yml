name: build

on:
  push:
    tags:
      - 'v*'
  # Builds the release as CI build 0.0.<run> without uploading, to validate a release or warm the caches.
  workflow_dispatch:

jobs:
  build:
    name: Build and release
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    env:
      ENGINE_VERSION: v0.14.0
    steps:
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg dpkg-dev rpm makepkg pacman-package-manager libarchive-tools zstd

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache the Android platform
        id: platform-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/platforms/android-37.0
          key: android-platform-37.0

      - name: Install the Android platform the app compiles against
        if: steps.platform-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      # Releases run on tags, which setup-gradle treats as read-only by default.
      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Cache the Reseam CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: reseam-cli-${{ env.ENGINE_VERSION }}

      - name: Download the Reseam CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --create-dirs -o engine/reseam-linux-x64 https://cdn.reseam.app/engine/$ENGINE_VERSION/reseam-linux-x64

      - name: Install the signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keystore.jks

      - name: Build and stage the release
        env:
          RESEAM_BIN: ${{ github.workspace }}/engine/reseam-linux-x64
          RESEAM_KEYSTORE: ${{ github.workspace }}/keystore.jks
          RESEAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESEAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESEAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x engine/reseam-linux-x64
          ./gradlew :composeApp:publishManagerIndex -PmanagerVersion=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.{0}', github.run_number) }} --no-daemon

      # Before the Forgejo release: its manager.json is what sends clients to the CDN.
      - name: Upload to the CDN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for f in composeApp/build/release/*; do
            curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
              -H "Cache-Control: public, max-age=86400" \
              -T "$f" "$R2_ENDPOINT/reseam-releases/manager/${{ github.ref_name }}/${f##*/}"
          done

      - name: Upload to the Forgejo release
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/manager
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: composeApp/build/release
          override: true

      - name: Keep the last three releases on the CDN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          r2() { curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" "$@"; }
          bucket="$R2_ENDPOINT/reseam-releases"
          for old in $(r2 "$bucket?list-type=2&prefix=manager/&delimiter=/" | grep -oP '(?<=<Prefix>)manager/[^<]+' | sort -V | head -n -3); do
            for key in $(r2 "$bucket?list-type=2&prefix=$old" | grep -oP '(?<=<Key>)[^<]+'); do
              r2 -X DELETE "$bucket/$key"
            done
          done
