name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    name: Build Android
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Build Android debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  build-desktop:
    name: Build Desktop
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    steps:
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg dpkg-dev rpm

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Build desktop distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon

      - name: Upload desktop distribution
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-dist
          path: composeApp/build/compose/binaries/main/**
